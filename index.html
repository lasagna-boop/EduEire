<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = "edu-theme-preference";
          var pref = localStorage.getItem(k);
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = "light";
          if (pref === "dark") resolved = "dark";
          else if (pref === "light") resolved = "light";
          else resolved = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EduÉire — community feed, university hubs, campus map, and topic flairs for students and educators in Ireland."
    />
    <meta name="theme-color" content="#2d6a4f" />
    <title>EduÉire — Irish higher-ed community</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
